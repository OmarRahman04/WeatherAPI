version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g Amazon.Lambda.Tools
      - export PATH="$PATH:/root/.dotnet/tools"

  pre_build:
    commands:
      - cd WeatherApi
      - dotnet restore

  build:
    commands:
      - dotnet lambda package --configuration Release --output-package WeatherApi.zip

artifacts:
  files:
    - WeatherApi/WeatherApi.zip