version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g Amazon.Lambda.Tools
      - export PATH="$PATH:/root/.dotnet/tools"

  build:
    commands:
      - cd WeatherApi
      - dotnet restore
      - dotnet lambda package --configuration Release --output-package WeatherApi.zip
      - aws lambda update-function-code --function-name WeatherApi --zip-file fileb://WeatherApi.zip